# Default XGBoost parameters. Experiment files override single keys.
# n_estimators is a cap: early stopping decides how many rounds are kept.
type: xgb
params:
  objective: binary:logistic
  eval_metric: aucpr  # watched by early stopping (aucpr or logloss)
  n_estimators: 2000
  early_stopping_rounds: 50
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1.0
  reg_lambda: 1.0
  reg_alpha: 0.0
  max_bin: 256
  scale_pos_weight: auto  # auto = negatives / positives of the rows being fitted
  device: cuda  # cpu or cuda
