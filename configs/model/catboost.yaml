# CatBoost defaults. Experiment files override single keys.
type: catboost
params:
  loss_function: Logloss
  eval_metric: PRAUC
  n_estimators: 2000
  early_stopping_rounds: 50
  depth: 4
  learning_rate: 0.05
  subsample: 0.8
  rsm: 0.8
  l2_leaf_reg: 3.0
  border_count: 254
  scale_pos_weight: auto
