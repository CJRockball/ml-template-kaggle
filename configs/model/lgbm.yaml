# LightGBM defaults. Experiment files override single keys.
type: lgbm
params:
  objective: binary
  eval_metric: average_precision
  n_estimators: 2000
  early_stopping_rounds: 50
  num_leaves: 15
  max_depth: -1
  learning_rate: 0.05
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  min_child_samples: 20
  reg_lambda: 1.0
  reg_alpha: 0.0
  max_bin: 255
  scale_pos_weight: auto
