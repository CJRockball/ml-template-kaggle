# Bronze dataset configuration and contract
project:
  name: ai4i-predictive-maintenance
  description: Binary machine-failure prediction using the AI4I 2020 dataset

data_paths:
  database: data/project.db
  raw_data: data/raw
  processed_data: data/processed
  artifacts: artifacts
  logs: logs

data:
  adapter: ai4i2020
  source: data/raw/ai4i2020.csv
  format: csv
  entity_id: UDI
  target: Machine failure
  task: binary_classification
  positive_label: 1

# Minimal technical & structural contract for Bronze ingestion
bronze_source_contract:
  rows: 10000
  columns: 14
  col_names:
    - UDI
    - Product ID
    - Type
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
    - Machine failure
    - TWF
    - HDF
    - PWF
    - OSF
    - RNF

  # Semantic column role classification for column_registry
  roles:
    id:
      - UDI
      - Product ID
    feature:
      - Type
      - "Air temperature [K]"
      - "Process temperature [K]"
      - "Rotational speed [rpm]"
      - "Torque [Nm]"
      - "Tool wear [min]"
    target:
      - Machine failure
    outcome:
      - TWF
      - HDF
      - PWF
      - OSF
      - RNF

# Business-level validation (enforced downstream in Silver / EDA)
validation:
  required_columns:
    - UDI
    - Product ID
    - Type
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
    - Machine failure
  allowed_target_values: [0, 1]
  require_unique_entity_id: true
  max_missing_rate: 0.0

# silver contract from eda
silver_eda_contract:
  canonical_names:
    UDI: udi
    Product ID: product_id
    Type: type
    "Air temperature [K]": air_temperature_k
    "Process temperature [K]": process_temperature_k
    "Rotational speed [rpm]": rotational_speed_rpm
    "Torque [Nm]": torque_nm
    "Tool wear [min]": tool_wear_min
    Machine failure: machine_failure
    TWF: twf
    HDF: hdf
    PWF: pwf
    OSF: osf
    RNF: rnf

  canonical_dtypes:
    udi: int64
    product_id: string
    type: category
    air_temperature_k: float64
    process_temperature_k: float64
    rotational_speed_rpm: int64
    torque_nm: float64
    tool_wear_min: int64
    machine_failure: int8
    twf: int8
    hdf: int8
    pwf: int8
    osf: int8
    rnf: int8